{% assign reports = site.cg_reports | where: "group", include.group | sort: "date" | reverse %}
{% if reports.size > 0 %}
<p><strong>Meeting reports</strong></p>
<table class="table-meeting-reports">
  <thead>
    <tr>
      <th>Meeting</th>
      <th>Report</th>
    </tr>
  </thead>
  <tbody>
    {% for report in reports %}
    <tr>
      <td>{{ report.date | date: "%-d %B %Y" }}</td>
      <td><a href="{{ report.url | relative_url }}">{{ report.title }}</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}
