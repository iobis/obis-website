<div class="row row-cols-1 row-cols-md-3 gx-4 gy-5">
    {% for post in include.filtered_posts limit:include.limit %}
    <div class="col">
      <div class="card card-blank">
        {% if post.image %}
        <div style="height: 200px;" class="card-img-top">
          <a href="{{ post.url }}"><img src="{{ post.image }}" alt="{{ post.title }}" style="width: 100%; height: 100%; object-fit: cover;"></a>
        </div>
        {% else %}
        <div style="height: 200px;" class="card-img-top">
        </div>
      {% endif %}
        <div class="card-body">
          <h5 class="card-title"><a href="{{ post.url }}">{{ post.title }}</a></h5>
          <p>{{ post.date | date: "%-d %B %Y" }}</p>
          <div class="mt-3">
            {% for tag in post.tags %}
                <a href="/tag/{{ tag | slugify }}"><span class="badge tag mb-1">{{ tag }}</span></a>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
</div>
