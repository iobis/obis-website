version: '3.8'
name: obis-website-dev

services:
  jekyll:
    image: jekyll/jekyll:latest
    command: bash -lc "chmod 777 /srv/jekyll/_site /srv/jekyll/_cache 2>/dev/null || true; chmod 666 /srv/jekyll/Gemfile.lock; bundle install && bundle exec jekyll build --disable-disk-cache"
    environment:
      - JEKYLL_ENV=production
      - BUNDLE_FROZEN=1
    volumes:
      - ./:/srv/jekyll
      - ./_site:/srv/jekyll/_site
      - jekyll_bundle:/usr/local/bundle

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    env_file:
      - .env
    volumes:
      - ./fastapi:/app
      - ./_site:/app/static
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "9001:8001"
    depends_on:
      - jekyll

  nginx:
    image: nginx:alpine
    ports:
      - "9002:80"
    volumes:
      - ./_site:/usr/share/nginx/html
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - nginx_cache:/var/cache/nginx
    depends_on:
      - jekyll
      - fastapi

volumes:
  nginx_cache:
  jekyll_bundle: