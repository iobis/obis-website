server {
    listen 80;

    # Expand <!--# include ... --> in HTML (static and proxied).
    # Banner content comes from the mounted ./runtime directory.
    ssi on;
    ssi_silent_errors on;

    # Resolve Docker service names at request time, not at nginx startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Optional site-wide banner snippet (empty or missing file = no banner).
    # internal: only SSI subrequests can read this path (not public HTTP clients).
    # Missing file returns 204 so SSI inserts nothing (not a 404 error page).
    location ^~ /runtime/ {
        internal;
        root /usr/share/nginx/html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        try_files $uri =204;
    }

    location /static/ {
        root /app;  # fastapi volume mount
    }

    location /node/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /dataset/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /taxon/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /area/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /occurrence/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /organization/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /country/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /doi/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /export/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /login/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /logout/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /auth/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location = /maptool {
        return 301 https://maptool.obis.org;
    }

    location = /maptool/ {
        return 301 https://maptool.obis.org;
    }

    location /institute/ {
        rewrite ^/institute/(.*)$ /organization/$1 permanent;
    }

    location / {
        set $upstream jekyll:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect http://jekyll:4000/ http://$http_host/;
        proxy_redirect http://localhost:4000/ http://$http_host/;
        proxy_pass http://$upstream$request_uri;
    }
}
