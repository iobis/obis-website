proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:100m max_size=1g inactive=10m use_temp_path=off;

map $request_method $bypass_cache_method {
    default 0;
    POST 1;
    PUT 1;
    PATCH 1;
    DELETE 1;
}

map $http_authorization $bypass_cache_auth {
    default 0;
    "" 0;
    ~.+ 1;
}

server {
    listen 80;
    server_name _;

    # Expand <!--# include ... --> in HTML (static and proxied).
    # Banner content comes from the mounted ./runtime directory.
    ssi on;
    ssi_silent_errors on;

    proxy_connect_timeout 30s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    # Resolve Docker service names at request time, not at nginx startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Default cache settings for API responses (overridable per location)
    proxy_cache api_cache;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 301 302 15m;
    proxy_cache_valid 404 1m;
    proxy_cache_methods GET HEAD;
    proxy_cache_bypass $bypass_cache_method $bypass_cache_auth;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header Access-Control-Expose-Headers "X-Cache-Status" always;

    location /node/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Expose-Headers "X-Cache-Status" always;
    }

    # location = /node {
    #     return 301 /node/;
    # }

    location /dataset/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Expose-Headers "X-Cache-Status" always;
    }

    # location = /dataset {
    #     return 301 /dataset/;
    # }

    location /taxon/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Expose-Headers "X-Cache-Status" always;
    }

    # location = /taxon {
    #     return 301 /taxon/;
    # }

    location /area/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Expose-Headers "X-Cache-Status" always;
    }

    location /occurrence/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Expose-Headers "X-Cache-Status" always;
    }

    # location = /area {
    #     return 301 /area/;
    # }

    location /organization/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Expose-Headers "X-Cache-Status" always;
    }

    location /country/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Expose-Headers "X-Cache-Status" always;
    }

    location /doi/ {
        proxy_cache off;
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /export/ {
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /login/ {
        proxy_cache off;
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /logout/ {
        proxy_cache off;
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location /auth/ {
        proxy_cache off;
        set $upstream fastapi:8001;
        proxy_pass http://$upstream$request_uri;
    }

    location = /maptool {
        return 301 https://maptool.obis.org;
    }

    location = /maptool/ {
        return 301 https://maptool.obis.org;
    }

    location /institute/ {
        rewrite ^/institute/(.*)$ /organization/$1 permanent;
    }

    # Optional site-wide banner snippet (empty or missing file = no banner).
    # internal: only SSI subrequests can read this path (not public HTTP clients).
    # Missing file returns 204 so SSI inserts nothing (not a 404 error page).
    # Mounted from ./runtime in docker-compose.prod.yml.
    location ^~ /runtime/ {
        internal;
        root /usr/share/nginx/html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        try_files $uri =204;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ $uri/index.html =404;
    }

} 