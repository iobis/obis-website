<html>
  {% include head.html %}

  <body>
    {% include header.html %}

    <div class="container container-post mt-5 mb-5">
        <p>News</p>
        <h1>{{ page.title }}</h1>
        <p>{{ page.date | date: "%-d %B %Y" }}</p>
        <div class="mb-4">
          {% for tag in page.tags %}
              <a href="/tag/{{ tag | slugify }}"><span class="badge tag mb-1">{{ tag }}</span></a>
          {% endfor %}
        </div>
        {% if page.intro %}
        <p class="intro">{{ page.intro }}</p>
        {% endif %}
        {{ content }}
    </div>

    {% include footer.html %}
  </body>
</html>
