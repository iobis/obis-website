<html>
{% include head.html %}

<script src="/assets/maplibre-gl.js"></script>
<link href="/assets/maplibre-gl.css" rel="stylesheet" />

<style>
  #headermap {
    height: 300px;
    width: 100%;
    position: relative;
    background-color: #ffffff;
  }
  .map-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }
  .map-overlay-text {
    color: #000000;
    font-size: 2rem;
    text-align: center;
  }
  .message {
    background-color: rgba(255, 255, 255, 0.8);
    padding: 0px 30px 0px 30px;
  }
  @media (min-width: 768px) {
    .map-overlay-text {
      font-size: 3rem;
    }
  }
</style>

<body>
{% include header.html %}

<div style="position: relative;">
  <div id="headermap"></div>
  <div class="map-overlay">
    <div class="map-overlay-text">
      <span class="message">Marine biodiversity data<br/>you can trust</span>
    </div>
  </div>
  <a id="headermap-explore" href="/taxon/126436" target="_blank" class="btn btn-light" style="position: absolute; bottom: 20px; right: 20px; z-index: 10;">
    Explore this map
  </a>
</div>

<script>
  const colorScales = {
    spectral: [
      "interpolate", ["linear"], ["get", "doc_count"],
      0, "#2c7bb6",
      10, "#abd9e9",
      100, "#ffffbf",
      1000, "#fdae61",
      10000, "#d7191c"
    ],
    hawaii: [
      "interpolate", ["linear"], ["get", "doc_count"],
      1, "#8c0862",
      10, "#c2456e",
      100, "#e08a5b",
      1000, "#c9c35a",
      10000, "#6db37a",
      50000, "#2a6b7a"
    ]
  };

  const headerMaps = [
    {
      tileQuery: "scientificname=Gadus",
      center: [-50, 50],
      zoom: 4,
      exploreUrl: "/taxon/126436",
      colorScale: "spectral"
    },
    {
      tileQuery: "datasetid=12a9b8a9-845a-4dba-8f64-6a6fe48cfe44",
      center: [-80.65, 25.31],
      zoom: 9.6,
      exploreUrl: "/dataset/12a9b8a9-845a-4dba-8f64-6a6fe48cfe44",
      colorScale: "hawaii"
    }
  ];
  const headerMapConfig = headerMaps[Math.floor(Math.random() * headerMaps.length)];
  document.getElementById("headermap-explore").href = headerMapConfig.exploreUrl;

  const map = new maplibregl.Map({
    container: 'headermap',
    style: {
        version: 8,
        glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
        sources: {
            coastlines: {
                type: "vector",
                tiles: ["https://tiles.obis.org/coastlines_tiles/{z}/{x}/{y}.pbf"],
                minzoom: 0,
                maxzoom: 14
            }
        },
        layers: [
            {
                id: "background",
                type: "background",
                paint: {
                    "background-color": "#ffffff"
                }
            },
            {
                id: "coastlines",
                type: "line",
                source: "coastlines",
                "source-layer": "coastlines",
                paint: {
                    "line-color": "#000000",
                    "line-width": 0.5
                }
            }
        ]
    },
    center: headerMapConfig.center,
    zoom: headerMapConfig.zoom,
    projection: 'mercator',
    attributionControl: false,
    scrollZoom: false,
    dragPan: false
  });
  map.once("click", function() {
      map.scrollZoom.enable();
      map.dragPan.enable();
  });
  map.on("load", function() {
    map.addSource("occurrence", {
        type: "vector",
        tiles: [
            `https://api.obis.org/occurrence/tile/{x}/{y}/{z}.mvt?${headerMapConfig.tileQuery}`
        ],
        scheme: "xyz"
    });

    map.addLayer({
        id: "obis-occurrence-layer",
        type: "fill",
        source: "occurrence",
        "source-layer": "grid",
        paint: {
            "fill-color": colorScales[headerMapConfig.colorScale],
            "fill-opacity": 0.3
        }
      });
    });

</script>

{{ content }}

{% include footer.html %}

</body>
</html>
