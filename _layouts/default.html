<html>
{% include head.html %}

<script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
<link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />

<style>
  #headermap {
    height: 300px;
    width: 100%;
    position: relative;
    background-color: #ffffff;
  }
  .map-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }
  .map-overlay-text {
    color: #000000;
    font-size: 2rem;
    text-align: center;
  }
  .message {
    background-color: rgba(255, 255, 255, 0.8);
    padding: 0px 30px 0px 30px;
  }
  @media (min-width: 768px) {
    .map-overlay-text {
      font-size: 3rem;
    }
  }
</style>

<body>
{% include header.html %}

<div style="position: relative;">
  <div id="headermap"></div>
  <div class="map-overlay">
    <div class="map-overlay-text">
      <span class="message">Marine biodiversity data<br/>you can trust</span>
    </div>
  </div>
  <a href="/taxon/126436" target="_blank" class="btn btn-light" style="position: absolute; bottom: 20px; right: 20px; z-index: 10;">
    Explore this map
  </a>
</div>

<script src="https://unpkg.com/@geomatico/maplibre-cog-protocol@0.5.0/dist/index.js"></script>
<script>
  maplibregl.addProtocol('cog', MaplibreCOGProtocol.cogProtocol);
  const map = new maplibregl.Map({
    container: 'headermap',
    style: {
        version: 8,
        glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
        sources: {
            coastlines: {
                type: "vector",
                tiles: ["https://tiles.obis.org/coastlines_tiles/{z}/{x}/{y}.pbf"],
                minzoom: 0,
                maxzoom: 14
            }
        },
        layers: [
            {
                id: "background",
                type: "background",
                paint: {
                    "background-color": "#ffffff"
                }
            },
            {
                id: "coastlines",
                type: "line",
                source: "coastlines",
                "source-layer": "coastlines",
                paint: {
                    "line-color": "#000000",
                    "line-width": 0.5
                }
            }
        ]
    },
    center: [-50, 50],
    zoom: 10,
    projection: 'mercator',
    attributionControl: false,
    scrollZoom: false,
    dragPan: false
  });
  map.once("click", function() {
      map.scrollZoom.enable();
      map.dragPan.enable();
  });
  map.on("load", function() {
    // map.addSource("occurrence", {
    //     type: "vector",
    //     tiles: [
    //         "https://api.obis.org/occurrence/tile/{x}/{y}/{z}.mvt?scientificname=Gadus"
    //     ],
    //     scheme: "xyz"
    // });

    // map.addLayer({
    //     id: "obis-occurrence-layer",
    //     type: "fill",
    //     source: "occurrence",
    //     "source-layer": "grid",
    //     paint: {
    //         "fill-color": [
    //             "interpolate",
    //             ["linear"],
    //             ["get", "doc_count"],
    //             0, "#2c7bb6",
    //             10, "#abd9e9",
    //             100, "#ffffbf",
    //             1000, "#fdae61",
    //             10000, "#d7191c"
    //         ],
    //         "fill-opacity": 0.3
    //     }
    //   });

    map.addSource('imageSource', {
      type: 'raster',
      url: 'cog://http://localhost/images/151324.tif',
      tileSize: 256
    });

    map.addLayer({
      id: 'imageLayer',
      source: 'imageSource',
      type: 'raster'
    });
    });

</script>

{{ content }}

{% include footer.html %}

</body>
</html>
