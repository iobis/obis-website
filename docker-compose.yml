version: '3.8'

services:
  jekyll:
    image: jekyll/jekyll:latest
    command: bash -lc "bundle install && bundle exec jekyll serve --watch --livereload --host 0.0.0.0 --config _config.yml,_config_dev.yml"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - ./:/srv/jekyll
      - ./_site:/srv/jekyll/_site
      - ./vendor/bundle:/usr/local/bundle
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    env_file:
      - .env
    volumes:
      - ./fastapi:/app
      - ./_site:/app/static  # Serve shared assets
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  nginx:
    image: nginx:alpine
    depends_on:
      - fastapi
      - jekyll
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - nginx_cache:/var/cache/nginx

volumes:
  nginx_cache: