<script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>
<script src="/assets/script.js"></script>

<section class="section-dense pb-0">
    <div class="container">
        <p>Occurrence</p>
        <h1>{{ occurrence.id }}</h1>
    </div>
</section>

<section class="section-dense">
  <div class="container">
    <pre id="json-output"></pre>
  </div>
</section>

<style>
  #json-output {
    background-color: #fafafa;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 20px;
    overflow-x: auto;
    font-size: 14px;
    line-height: 1.6;
    font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
    color: #263238;
  }
  .json-key { color: #1976d2; font-weight: 600; }
  .json-string { color: #689f38; }
  .json-number { color: #f57c00; }
  .json-boolean { color: #7b1fa2; }
  .json-null { color: #0097a7; font-style: italic; }
</style>

<script>
  const data = {{ occurrence | tojson | safe }};
  
  function syntaxHighlight(json) {
    json = JSON.stringify(json, null, 2);
    json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
      let cls = 'json-number';
      if (/^"/.test(match)) {
        if (/:$/.test(match)) {
          cls = 'json-key';
        } else {
          cls = 'json-string';
        }
      } else if (/true|false/.test(match)) {
        cls = 'json-boolean';
      } else if (/null/.test(match)) {
        cls = 'json-null';
      }
      return '<span class="' + cls + '">' + match + '</span>';
    });
  }
  
  document.getElementById('json-output').innerHTML = syntaxHighlight(data);
</script>
