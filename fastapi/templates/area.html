<script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>
<script src="/assets/script.js"></script>

<section class="section-dense pb-0">
    <div class="container">
        <p>Area</p>
        <h1>{{ area.name }}</h1>
        <a href="https://mapper.obis.org?areaid={{ area.id }}" class="badge badge-mapper" target="blank">Open in mapper</a>
    </div>
</section>

<section class="section-dense">
  <div class="container">
    <div class="row align-items-center">

      <div class="col-12 col-md-6">
        <div class="row">
          <div class="col-12">
            <div class="row">
              <div class="col-6 col-md-6 mb-4">
                  <div class="display-6 fw-bold">{{ "{:0,.0f}".format(statistics.datasets) }}</div>
                  <div>datasets</div>
              </div>
              <div class="col-6 col-md-6 mb-4">
                  <div class="display-6 fw-bold">{{ "{:0,.0f}".format(statistics.records) }}</div>
                  <div>occurrence records</div>
              </div>
              <div class="col-6 col-md-6 mb-4">
                  <div class="display-6 fw-bold">{{ "{:0,.0f}".format(statistics.taxa) }}</div>
                  <div>taxa</div>
              </div>
              <div class="col-6 col-md-6 mb-4">
                  <div class="display-6 fw-bold">{{ "{:0,.0f}".format(statistics.species) }}</div>
                  <div>species</div>
              </div>
            </div>
            <div class="col-12">
              <div id="timeplot"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <div id="sunburst" style="height: 600px;"></div>
      </div>

    </div>
  </div>
</section>

<section class="section-dense section-dark">
  <div class="container">
    <h2>Datasets</h2>
    <div id="datasets"></div>
  </div>
</section>

<script>
renderSunburst("sunburst", { areaid: "{{ area.id }}" });
renderDatasetTable("datasets", { areaid: "{{ area.id }}" });
renderPublisherTable("publishers", { areaid: "{{ area.id }}" });
renderTimeplot("timeplot", { areaid: "{{ area.id }}" })
</script>
