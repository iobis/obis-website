<script src="https://cdn.plot.ly/plotly-3.0.1.min.js" charset="utf-8"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
<script src="/assets/script.js"></script>

<section class="section-dense">
    <div class="container">

        <h1>{{ node.name }}</h1>
        <p><a href="https://mapper.obis.org?nodeid={{ node.id }}" class="badge badge-mapper" target="blank">Open in mapper</a></p>

        <p>{{ node.description }}</p>

        <div class="row">
            {% for contact in node.contacts %}
            <div class="col-md-4">
                <p><b>{{ contact.givenname }} {{ contact.surname }}</b>
                <br/>{{ contact.email }}</p>
            </div>
            {% endfor %}
        </div>

        <div class="row">
            <div id="m"></div>
        </div>
    
    </div>
</section>

<section class="section-dense section-dark">
    <div class="container">

        <h2>Datasets</h2>

        <div id="datasets"></div>
    </div>

</section>

<section class="section-dense">
    <div class="row align-items-center">
        <div class="col-12 col-md-6">
            <div id="timeplot"></div>
        </div>
        <div class="col-12 col-md-6">
            <div id="sunburst" style="height: 600px;"></div>
        </div>
    </div>
</section>

<script>
renderSunburst("sunburst", { nodeid: "{{ node.id }}" });
renderDatasetTable("datasets", { nodeid: "{{ node.id }}" });
renderMap("m", { nodeid: "{{ node.id }}" })
renderTimeplot("timeplot", { nodeid: "{{ node.id }}" })
</script>
