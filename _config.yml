title: Ocean Biodiversity Information System (OBIS)
description: Ocean Biodiversity Information System (OBIS)
baseurl: ""
url: "https://obis.org"

markdown: kramdown
encoding: UTF-8
kramdown:
  syntax_highlighter: rouge
  input: GFM
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-get-json
  - jekyll-sitemap
  - jekyll-paginate-v2

pagination:
  enabled: true
  per_page: 12
  permalink: '/page/:num/'
  title: ' - page :num'
  sort_reverse: true

jekyll_get_json:
  - data: statistics
    json: https://api.obis.org/statistics/summaries

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
  - nginx
  - docker-compose.yml

collections:
  partnerships:
    output: true
  data_products:
    output: true
  usecases:
    output: true
  sources:
    output: true

menu:
  - title: "Who we are"
    subitems:
    - title: "Vision and mission"
      url: "/about/visionmission"
    - title: "Nodes"
      url: "/about/nodes"
    - title: "Governance"
      url: "/about/governance"
    - title: "Team and contacts"
      url: "/contact"
  - title: "What we do"
    subitems:
    - title: "Core activities"
      url: "/whatwedo/core-activities"
    - title: "Projects"
      url: "/projects"
    - title: "Partnerships"
      url: "/partnerships"
    - title: "Impact"
      url: "/whatwedo/impact"
  - title: "Data"
    subitems:
    - title: "Data access"
      url: "/data/access"
    - title: "Mapper"
      url: "https://mapper.obis.org"
      target: "_blank"
    - title: "Contribute data"
      url: "/data/contribute"
    - title: "External sources"
